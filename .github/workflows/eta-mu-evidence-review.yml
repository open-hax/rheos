# SPDX-License-Identifier: GPL-3.0-or-later
name: eta-mu evidence review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  evidence-review:
    name: Evidence-first review (eta-mu)
    # Parent-selected merged Eta/Muse pair; caller remains local/unpublished.
    # New-head native caller CI/review qualification remains parent-owned.
    uses: open-hax/eta-mu/.github/workflows/opencode-code-review.yml@694a2602709d130b2a60045a25537f1b4476ec1f
    secrets: inherit
    with:
      pr_head_sha: ${{ github.event.pull_request.head.sha }}
      model: opencode/mimo-v2.6-flash-free
      muse_revision: 0b9a91492c8355e6933dc2164d35668cb76d9e60
      agents_revision: 7fd3252e7663ad5e68be5e90429d126aa66c38c8
      setup_eta_mu_toolchain: true
      evidence_gates_script: |
        # run_gate records failures but returns zero: check prerequisite statuses explicitly.
        export PATH="$RUNNER_TEMP/rheos-tools/bin:$PATH"
        gate_ok() { [[ "$(awk -F= -v gate="$1" '$1 == gate {print $2}' "$statuses")" == 0 ]]; }
        skip_gates() {
          for gate in "$@"; do printf '%s=125\n' "$gate" >> "$statuses"; done
          printf 'Prerequisite failed; skipped: %s\n' "$*" >> "$log"
        }

        run_gate clojure_lsp_install bash --noprofile --norc -e -o pipefail -c '
          version=2025.08.25-14.21.46
          asset=clojure-lsp-native-static-linux-amd64.zip
          release="https://github.com/clojure-lsp/clojure-lsp/releases/download/$version"
          temporary=$(mktemp -d)
          trap '\''rm -rf "$temporary"'\'' EXIT
          curl -fsSL "$release/$asset" -o "$temporary/$asset"
          curl -fsSL "$release/$asset.sha256" -o "$temporary/checksum"
          digest=$(cut -d " " -f 1 "$temporary/checksum")
          [[ "$digest" =~ ^[[:xdigit:]]{64}$ ]]
          printf "%s  %s\n" "$digest" "$temporary/$asset" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rheos-tools/bin"
          unzip -o -q "$temporary/$asset" -d "$RUNNER_TEMP/rheos-tools/bin"
          clojure-lsp --version
        '
        run_gate tools bash --noprofile --norc -e -o pipefail -c '
          # BEGIN REQUIRED_TOOLS
          for tool in node pnpm java clojure bb clj-kondo clojure-lsp git curl unzip; do
            command -v "$tool" || { printf "Missing required tool: %s\n" "$tool" >&2; exit 1; }
          done
          # END REQUIRED_TOOLS
          node -e '\''if (Number(process.versions.node.split(".")[0]) !== 22) throw Error("Node 22 required"); console.log(process.version)'\''
          pnpm --version
          java -version
          clojure -Sdescribe
          bb --version
          clj-kondo --version
          clojure-lsp --version
        '
        if gate_ok clojure_lsp_install && gate_ok tools; then
          run_gate caller_fixture node --test .github/fixtures/rheos-evidence-caller.test.mjs
          run_gate install pnpm install --ignore-scripts --lockfile=false
          run_gate bootstrap_sources bash --noprofile --norc -e -o pipefail -c '
            # Consume the source bootstrap declarations without its suppressed clone/copy errors.
            source_script=scripts/bootstrap-source-deps.sh
            eta_sha=$(sed -n '\''s/^ETA_MU_SHA="\([a-f0-9]\{40\}\)"$/\1/p'\'' "$source_script")
            chat_sha=$(sed -n '\''s/^CHAT_UI_SHA="\([a-f0-9]\{40\}\)"$/\1/p'\'' "$source_script")
            eta_url=$(sed -n '\''s/^ETA_MU_URL="\(https:\/\/github.com\/[^" ]*\.git\)"$/\1/p'\'' "$source_script")
            chat_url=$(sed -n '\''s/^CHAT_UI_URL="\(https:\/\/github.com\/[^" ]*\.git\)"$/\1/p'\'' "$source_script")
            [[ "$eta_sha" =~ ^[a-f0-9]{40}$ && "$chat_sha" =~ ^[a-f0-9]{40}$ ]]
            [[ -n "$eta_url" && -n "$chat_url" ]]
            temporary=$(mktemp -d)
            trap '\''rm -rf "$temporary"'\'' EXIT
            git clone --filter=blob:none --no-checkout "$eta_url" "$temporary/eta-mu"
            git -C "$temporary/eta-mu" checkout --detach "$eta_sha"
            [[ "$(git -C "$temporary/eta-mu" rev-parse HEAD)" == "$eta_sha" ]]
            git clone --filter=blob:none --no-checkout "$chat_url" "$temporary/chat-ui"
            git -C "$temporary/chat-ui" checkout --detach "$chat_sha"
            [[ "$(git -C "$temporary/chat-ui" rev-parse HEAD)" == "$chat_sha" ]]
            # No warm dependency directory can stand in for the declared immutable source.
            rm -rf deps/protocols/src deps/chat-ui/src
            mkdir -p deps/protocols/src deps/chat-ui/src
            cp -R "$temporary/eta-mu/packages/protocols/src/." deps/protocols/src/
            cp -R "$temporary/chat-ui/src/." deps/chat-ui/src/
            [[ -n "$(find deps/protocols/src -type f -print -quit)" ]]
            [[ -n "$(find deps/chat-ui/src -type f -print -quit)" ]]
            printf "Source pins: eta-mu=%s chat-ui=%s\n" "$eta_sha" "$chat_sha"
            bash "$source_script"
          '
          if gate_ok caller_fixture && gate_ok install && gate_ok bootstrap_sources; then
            # Ephemeral generated directories only; tracked changes remain subject to upstream clean guard.
            run_gate generated_excludes bash --noprofile --norc -e -o pipefail -c '
              exclude=$(git rev-parse --git-path info/exclude)
              printf "%s\n" /node_modules/ /deps/ /dist/ /dist-dev/ /target/ /.shadow-cljs/ /.cpcache/ /.lsp/ /.clj-kondo/.cache/ /.clj-kondo/imports/ >> "$exclude"
            '
            run_gate lint pnpm lint
            run_gate clojure_lsp clojure-lsp diagnostics --project-root "$PWD" --settings '{:source-paths ["src" "test" "deps/protocols/src" "deps/chat-ui/src"] :project-specs [{:project-path "shadow-cljs.edn" :classpath-cmd ["pnpm" "exec" "shadow-cljs" "classpath"]}]}' --verbose
            run_gate test bash --noprofile --norc -e -o pipefail -c 'pnpm test 2>&1 | tee "$RUNNER_TEMP/rheos-test.log"'
            run_gate build bash --noprofile --norc -e -o pipefail -c 'pnpm build 2>&1 | tee "$RUNNER_TEMP/rheos-build.log"'
            run_gate completed_outputs bash --noprofile --norc -e -o pipefail -c '
              # BEGIN COMPLETED_OUTPUTS
              node --input-type=module - "$RUNNER_TEMP/rheos-test.log" "$RUNNER_TEMP/rheos-build.log" <<'\''JS'\''
        import { readFileSync } from "node:fs";
        const [testPath, buildPath] = process.argv.slice(2);
        const testLog = readFileSync(testPath, "utf8");
        const buildLog = readFileSync(buildPath, "utf8");
        if (/\b[1-9]\d* warnings\b|\bWARNING\b/i.test(testLog + buildLog)) throw Error("Compiler warnings");
        const runs = [...testLog.matchAll(/^Ran (\d+) tests containing (\d+) assertions\.$/gm)];
        const results = [...testLog.matchAll(/^(\d+) failures, (\d+) errors\.$/gm)];
        if (!runs.length || runs.length !== results.length) throw Error("Missing completed test counts");
        for (let i = 0; i < runs.length; i++) {
          if (Number(runs[i][1]) <= 0 || Number(runs[i][2]) <= 0) throw Error("Empty tests or assertions");
          if (runs[i][1] !== runs[0][1] || runs[i][2] !== runs[0][2]) throw Error("Inconsistent suite counts");
          if (Number(results[i][1]) || Number(results[i][2])) throw Error("Failed tests");
        }
        for (const target of ["server", "cli", "github-sync", "app"]) {
          const line = buildLog.split("\n").find(line => line.startsWith(`[:${target}] Build completed.`));
          if (!line || !/\([1-9]\d* files, \d+ compiled, 0 warnings, /.test(line)) throw Error(`Incomplete build: ${target}`);
        }
        console.log(`Completed suite: ${runs[0][1]} tests / ${runs[0][2]} assertions; four build targets, zero compiler warnings`);
        JS
              for artifact in dist/test.cjs dist/server.js dist/cli.cjs dist/github-sync.cjs dist/web/js/main.js; do
                test -s "$artifact"
              done
              # END COMPLETED_OUTPUTS
            '
          else
            skip_gates generated_excludes lint clojure_lsp test build completed_outputs
          fi
        else
          skip_gates caller_fixture install bootstrap_sources generated_excludes lint clojure_lsp test build completed_outputs
        fi
